[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bintexttools"
version = "0.2.0"
description = "Tools for Binary and Text data conversion"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "Marcin Zelek", email = "marcin.zelek@gmail.com"}
]
keywords = ["binary", "ascii", "text", "hex", "base64", "convert", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/xmzxmz/xmz-bin-text-tools"
Repository = "https://github.com/xmzxmz/xmz-bin-text-tools"
Issues = "https://github.com/xmzxmz/xmz-bin-text-tools/issues"

[project.optional-dependencies]
# uv pip install .[web]
# uv pip install .[web,dev]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "jinja2>=3.1.4",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "build>=1.0.0",
]

[project.scripts]
bin2text = "bintexttools.bin2text:main"
text2bin = "bintexttools.text2bin:main"

[tool.hatchling.build]
source-dir = "src"

[tool.hatchling.build.targets.sdist]
include = [
    "src",
    "README.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
