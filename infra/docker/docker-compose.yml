services:
  bintexttools-web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: ${DOCKER_IMAGE:-bintexttools:latest}
    container_name: bintexttools-web
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - bintexttools-network

networks:
  bintexttools-network:
    driver: bridge

